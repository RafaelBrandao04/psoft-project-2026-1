## ==============================================================================
## Profile: Development (dev)
## Purpose: Local developer environments, rapid feedback loops, and debugging
## ==============================================================================

demo.environment=dev
server.port=${PORT:8080}

## In-Memory ephemeral H2 database for dev
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:devdb;DB_CLOSE_DELAY=-1;IGNORECASE=TRUE}
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:devuser}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:devpass}

## JPA & SQL Logging enabled for query inspection
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update

## H2 Web Console enabled for runtime database debugging
spring.h2.console.enabled=true
spring.h2.console.settings.web-allow-others=true

## Local uploads storage
file.upload-dir=${FILE_UPLOAD_DIR:uploads-psoft-g1/dev}

## Logging Levels
logging.level.pt.psoft.g1=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=DEBUG

## Full Actuator Health Details
management.endpoint.health.show-details=always

