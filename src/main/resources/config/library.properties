# Lending configuration
lendingDurationInDays=15
fineValuePerDayInCents=200

# Lending Policies configuration (setup time parameterization - Lending Policies Specification v1.0)
lending.policies.standard.duration-in-days=15
lending.policies.standard.max-simultaneous-lendings=3
lending.policies.standard.fine-value-per-day-in-cents=200
lending.policies.standard.max-renewals=2
lending.policies.standard.renewal-period-in-days=15

lending.policies.adaptive.max-active-lendings=5
lending.policies.adaptive.first-threshold=1
lending.policies.adaptive.second-threshold=2
lending.policies.adaptive.long-period=30
lending.policies.adaptive.standard-period=15
lending.policies.adaptive.short-period=7
lending.policies.adaptive.max-renewals=2
lending.policies.adaptive.renewal-period=15
lending.policies.adaptive.fine-value-per-day-in-cents=200

lending.policies.selection.history-period=6
lending.policies.selection.min-completed-lendings=3
lending.policies.selection.min-on-time-ratio=80.0

lending.policies.long-term.duration-in-days=30
lending.policies.long-term.max-simultaneous-lendings=5
lending.policies.long-term.fine-value-per-day-in-cents=100

lending.policies.short-term.duration-in-days=7
lending.policies.short-term.max-simultaneous-lendings=5
lending.policies.short-term.fine-value-per-day-in-cents=400

lending.policies.premium.duration-in-days=30
lending.policies.premium.max-simultaneous-lendings=5
lending.policies.premium.fine-value-per-day-in-cents=100

# Reader configuration
minimumReaderAge=12

# Book suggestions configuration
suggestionsLimitPerGenre=2

# Bibliographic information external sources configuration (setup time)
# Options: googlebooks, openlibrary (supports single source or comma-separated list)
bibliographic.providers=googlebooks,openlibrary
bibliographic.googlebooks.base-url=https://www.googleapis.com/books/v1
bibliographic.openlibrary.base-url=https://openlibrary.org
bibliographic.timeout-ms=3000

# Reader notification external channels configuration
## Supported channels: email, sms, webhook (individually or in combination)
notification.channels=email,sms,webhook
notification.webhook.url=https://webhook.site/aa8be08d-93c1-407a-985a-c2f805e862e8
notification.webhook.timeout-ms=3000
notification.sms.gateway-url=https://psoft-g1-sms-gateway.free.beeceptor.com/api/v1/sms/send
notification.sms.timeout-ms=3000
spring.mail.host=sandbox.smtp.mailtrap.io
spring.mail.port=2525
