## ==============================================================================
## Profile: User Acceptance Testing (uat)
## Purpose: Mirroring application-staging for DEI Cloud VM vs806 (port 8082)
## ==============================================================================

demo.environment=uat
server.port=${PORT:8082}

## UAT Database
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:uatdb;DB_CLOSE_DELAY=-1;IGNORECASE=TRUE}
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:uatuser}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:uatpass}

## JPA settings
spring.jpa.show-sql=false
spring.jpa.hibernate.ddl-auto=update

## H2 Web Console disabled for security
spring.h2.console.enabled=false

## Dedicated UAT uploads directory
file.upload-dir=${FILE_UPLOAD_DIR:/opt/psoft-g1/uat/uploads}

## Logging configuration
logging.level.pt.psoft.g1=INFO
logging.level.org.springframework.web=WARN

## Actuator Health Details
management.endpoint.health.show-details=always

