## ==============================================================================
## Profile: Production (prod)
## Purpose: Live production deployment on dedicated VM vs336 (port 8080)
## ==============================================================================

demo.environment=prod
server.port=${PORT:8080}

## Production Database Configuration
## Persistent H2 database on production filesystem or external relational DB via env vars
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:file:/opt/psoft-g1/prod/data/proddb;DB_CLOSE_DELAY=-1;IGNORECASE=TRUE}
spring.datasource.driverClassName=${SPRING_DATASOURCE_DRIVER:org.h2.Driver}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:produser}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:prodpass}

## JPA settings: Strict production rules, no automatic DDL mutation in live runtime
spring.jpa.show-sql=false
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}

## Security Hardening: H2 Web Console STRICTLY DISABLED
spring.h2.console.enabled=false
spring.h2.console.settings.web-allow-others=false

## Dedicated isolated production upload directory
file.upload-dir=${FILE_UPLOAD_DIR:/opt/psoft-g1/prod/uploads}

## Minimal logging overhead
logging.level.pt.psoft.g1=WARN
logging.level.org.springframework=WARN
logging.level.org.hibernate=ERROR

## Actuator Health Details restricted
management.endpoint.health.show-details=when-authorized

