spring.application.name=psoft-g1

##
## Profiles
##
spring.profiles.active=bootstrap

##
## OpenAPI
##
springdoc.api-docs.enabled=true
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui

##
## JWT
##
jwt.private.key=classpath:rsa.private.key
jwt.public.key=classpath:rsa.public.key

##
## datasource
##
#spring.datasource.url=jdbc:h2:tcp://localhost/~/psoft-g1;IGNORECASE=TRUE
# ^ H2 Console needs to be running, and file needs to be previously created in path ^
#spring.datasource.url=jdbc:h2:~/psoft-g1
# ^ H2 Console CAN'T be running, and file needs to be previously created in path ^
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;IGNORECASE=TRUE
# ^ No prerequisites ^
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=mysqluser
spring.datasource.password=mysqlpass
#spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
#spring.jpa.hibernate.dialect=org.hibernate.dialect.H2Dialect

## show SQL
spring.jpa.show-sql=false
#hibernate.show_sql=false
#spring.jpa.hibernate.format_sql=true
#Ricardo: what is this for?

## database schema generation
spring.jpa.generate-ddl=true
spring.jpa.hibernate.ddl-auto=update

##
## H2 console for development purposes.
## e.g., http://localhost:8080/h2-console
##
## for security reasons this setting should be false
spring.h2.console.enabled=true

##
## MULTIPART (MultipartProperties)
##
# Enable multipart uploads
spring.servlet.multipart.enabled=true
# Threshold after which files are written to disk.
spring.servlet.multipart.file-size-threshold=2KB
# Max file size.
spring.servlet.multipart.max-file-size=200MB
# Max Request Size
spring.servlet.multipart.max-request-size=215MB

##
## File Storage Properties
##
# All files uploaded through the REST API will be stored in this directory
file.upload-dir=uploads-psoft-g1
#Maximum photo size -> in bytes | by the rules of the forum it's 20KB
file.photo_max_size=20000

## Api Ninjas key
my.ninjas-key=a5nSlaa4JxIubY09H+NYuQ==cY9FegnFmAvYi6fN

##
## Bibliographic information external sources (setup time configuration)
##
bibliographic.providers=googlebooks,openlibrary
bibliographic.googlebooks.base-url=https://www.googleapis.com/books/v1
bibliographic.openlibrary.base-url=https://openlibrary.org
bibliographic.timeout-ms=3000

##
## Reader notifications setup time configuration
## Supported channels: email, sms, webhook (individually or in combination)
##
notification.channels=email,sms,webhook
notification.webhook.url=https://webhook.site/aa8be08d-93c1-407a-985a-c2f805e862e8
notification.webhook.timeout-ms=3000

##
## Environment and Actuator / Readiness Configuration
##
server.port=${PORT:8080}
demo.environment=${DEMO_ENVIRONMENT:local}
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=always

##
## Lending Policies configuration (setup time parameterization - Issue #25 / ASR02)
##
lending.policies.long-term.duration-in-days=30
lending.policies.long-term.max-simultaneous-lendings=5
lending.policies.long-term.fine-value-per-day-in-cents=100

lending.policies.standard.duration-in-days=15
lending.policies.standard.max-simultaneous-lendings=5
lending.policies.standard.fine-value-per-day-in-cents=200

lending.policies.short-term.duration-in-days=7
lending.policies.short-term.max-simultaneous-lendings=5
lending.policies.short-term.fine-value-per-day-in-cents=400

lending.policies.premium.duration-in-days=30
lending.policies.premium.max-simultaneous-lendings=5
lending.policies.premium.fine-value-per-day-in-cents=100
