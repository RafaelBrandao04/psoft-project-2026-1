spring.application.name=psoft-g1

##
## Profiles (Defaults to dev with bootstrap seeding if not overridden)
##
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev,bootstrap}

##
## Server & Environment Metadata
##
server.port=${PORT:8080}
demo.environment=${DEMO_ENVIRONMENT:local}

##
## OpenAPI / Swagger
##
springdoc.api-docs.enabled=true
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui

##
## JWT Security Keys
##
jwt.private.key=${JWT_PRIVATE_KEY:classpath:rsa.private.key}
jwt.public.key=${JWT_PUBLIC_KEY:classpath:rsa.public.key}

##
## Datasource Configuration (Configurable via environment variables)
##
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;IGNORECASE=TRUE}
spring.datasource.driverClassName=${SPRING_DATASOURCE_DRIVER:org.h2.Driver}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:mysqluser}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:mysqlpass}

## JPA / Hibernate SQL & Schema Management
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
spring.jpa.generate-ddl=true
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}

##
## H2 Console (Disabled in production profiles for security)
##
spring.h2.console.enabled=${SPRING_H2_CONSOLE_ENABLED:true}

##
## Multipart File Upload Properties
##
spring.servlet.multipart.enabled=true
spring.servlet.multipart.file-size-threshold=2KB
spring.servlet.multipart.max-file-size=200MB
spring.servlet.multipart.max-request-size=215MB

##
## File Storage Properties
##
file.upload-dir=${FILE_UPLOAD_DIR:uploads-psoft-g1}
file.photo_max_size=${FILE_PHOTO_MAX_SIZE:20000}

##
## External API Keys
##
my.ninjas-key=${NINJAS_API_KEY:a5nSlaa4JxIubY09H+NYuQ==cY9FegnFmAvYi6fN}

##
## Bibliographic Information External Sources (Setup time configuration)
##
bibliographic.providers=${BIBLIOGRAPHIC_PROVIDERS:googlebooks,openlibrary}
bibliographic.googlebooks.base-url=${BIBLIOGRAPHIC_GOOGLEBOOKS_BASE_URL:https://www.googleapis.com/books/v1}
bibliographic.openlibrary.base-url=${BIBLIOGRAPHIC_OPENLIBRARY_BASE_URL:https://openlibrary.org}
bibliographic.timeout-ms=${BIBLIOGRAPHIC_TIMEOUT_MS:3000}

##
## Reader Notifications Setup Time Configuration
## Supported channels: email, sms, webhook (individually or in combination)
##
notification.channels=${NOTIFICATION_CHANNELS:email,sms,webhook}
notification.webhook.url=${NOTIFICATION_WEBHOOK_URL:https://webhook.site/aa8be08d-93c1-407a-985a-c2f805e862e8}
notification.webhook.timeout-ms=${NOTIFICATION_WEBHOOK_TIMEOUT_MS:3000}

##
## Observability & Actuator Readiness Configuration
##
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=${MANAGEMENT_HEALTH_DETAILS:always}

##
## Lending Policies Configuration (Setup time parameterization - Issue #25 / ASR02)
##
lending.policies.long-term.duration-in-days=30
lending.policies.long-term.max-simultaneous-lendings=5
lending.policies.long-term.fine-value-per-day-in-cents=100

lending.policies.standard.duration-in-days=15
lending.policies.standard.max-simultaneous-lendings=5
lending.policies.standard.fine-value-per-day-in-cents=200

lending.policies.short-term.duration-in-days=7
lending.policies.short-term.max-simultaneous-lendings=5
lending.policies.short-term.fine-value-per-day-in-cents=400

lending.policies.premium.duration-in-days=30
lending.policies.premium.max-simultaneous-lendings=5
lending.policies.premium.fine-value-per-day-in-cents=100
