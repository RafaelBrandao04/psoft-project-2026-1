spring.application.name=psoft-g1

##
## Automatically load local .env file if present (optional, ignored in CI/Production if absent)
##
spring.config.import=optional:file:.env[.properties]

##
## Profiles (Defaults to bootstrap seeding if not overridden via SPRING_PROFILES_ACTIVE)
##
spring.profiles.active=${SPRING_PROFILES_ACTIVE:bootstrap}

##
## Server & Environment Metadata (Aligned with systemd /etc/psoft-g1/<env>.env)
##
server.port=${PORT:8080}
demo.environment=${DEMO_ENVIRONMENT:local}

##
## OpenAPI / Swagger
##
springdoc.api-docs.enabled=true
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui

##
## JWT Security Keys
##
jwt.private.key=${JWT_PRIVATE_KEY:classpath:rsa.private.key}
jwt.public.key=${JWT_PUBLIC_KEY:classpath:rsa.public.key}

##
## Datasource Configuration (Configurable via environment variables)
##
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;IGNORECASE=TRUE}
spring.datasource.driverClassName=${SPRING_DATASOURCE_DRIVER:org.h2.Driver}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:mysqluser}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:mysqlpass}

## JPA / Hibernate SQL & Schema Management
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
spring.jpa.generate-ddl=true
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}

##
## H2 Console (Disabled in production via SPRING_H2_CONSOLE_ENABLED=false)
##
spring.h2.console.enabled=${SPRING_H2_CONSOLE_ENABLED:true}

##
## Multipart File Upload Properties
##
spring.servlet.multipart.enabled=true
spring.servlet.multipart.file-size-threshold=2KB
spring.servlet.multipart.max-file-size=200MB
spring.servlet.multipart.max-request-size=215MB

##
## File Storage Properties
##
file.upload-dir=${FILE_UPLOAD_DIR:uploads-psoft-g1}
file.photo_max_size=${FILE_PHOTO_MAX_SIZE:20000}

##
## External API Keys
##
my.ninjas-key=${NINJAS_API_KEY:a5nSlaa4JxIubY09H+NYuQ==cY9FegnFmAvYi6fN}

##
## Bibliographic Information External Sources (Setup time configuration)
##
bibliographic.providers=${BIBLIOGRAPHIC_PROVIDERS:googlebooks,openlibrary}
bibliographic.googlebooks.base-url=${BIBLIOGRAPHIC_GOOGLEBOOKS_BASE_URL:https://www.googleapis.com/books/v1}
bibliographic.openlibrary.base-url=${BIBLIOGRAPHIC_OPENLIBRARY_BASE_URL:https://openlibrary.org}
bibliographic.timeout-ms=${BIBLIOGRAPHIC_TIMEOUT_MS:3000}

##
## Reader Notifications Setup Time Configuration
## Supported channels: email, sms, webhook (individually or in combination)
##
notification.channels=${NOTIFICATION_CHANNELS:email,sms,webhook}
notification.webhook.url=${NOTIFICATION_WEBHOOK_URL:https://webhook.site/aa8be08d-93c1-407a-985a-c2f805e862e8}
notification.webhook.timeout-ms=${NOTIFICATION_WEBHOOK_TIMEOUT_MS:3000}
notification.sms.gateway-url=${NOTIFICATION_SMS_GATEWAY_URL:https://psoft-g1-sms-gateway.free.beeceptor.com/api/v1/sms/send}
notification.sms.timeout-ms=${NOTIFICATION_SMS_TIMEOUT_MS:3000}
notification.email.from=${NOTIFICATION_EMAIL_FROM:notifications@library.psoft.pt}
spring.mail.host=${SPRING_MAIL_HOST:sandbox.smtp.mailtrap.io}
spring.mail.port=${SPRING_MAIL_PORT:2525}
spring.mail.username=${MAILTRAP_USERNAME:721f5cbf7fb486}
spring.mail.password=${MAILTRAP_PASSWORD:d2458c0e046129}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

##
## Observability & Actuator Readiness Configuration
##
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=${MANAGEMENT_HEALTH_DETAILS:always}

##
## Lending Policies Configuration (Setup time parameterization)
##
lending.policies.standard.duration-in-days=${LENDING_POLICY_STANDARD_DAYS:15}
lending.policies.standard.max-simultaneous-lendings=${LENDING_POLICY_STANDARD_MAX:3}
lending.policies.standard.fine-value-per-day-in-cents=${LENDING_POLICY_STANDARD_FINE:200}
lending.policies.standard.max-renewals=${LENDING_POLICY_STANDARD_MAX_RENEWALS:2}
lending.policies.standard.renewal-period-in-days=${LENDING_POLICY_STANDARD_RENEWAL_DAYS:15}

lending.policies.adaptive.max-active-lendings=${LENDING_POLICY_ADAPTIVE_MAX:5}
lending.policies.adaptive.first-threshold=${LENDING_POLICY_ADAPTIVE_FIRST_THRESHOLD:1}
lending.policies.adaptive.second-threshold=${LENDING_POLICY_ADAPTIVE_SECOND_THRESHOLD:2}
lending.policies.adaptive.long-period=${LENDING_POLICY_ADAPTIVE_LONG_DAYS:30}
lending.policies.adaptive.standard-period=${LENDING_POLICY_ADAPTIVE_STANDARD_DAYS:15}
lending.policies.adaptive.short-period=${LENDING_POLICY_ADAPTIVE_SHORT_DAYS:7}
lending.policies.adaptive.max-renewals=${LENDING_POLICY_ADAPTIVE_MAX_RENEWALS:2}
lending.policies.adaptive.renewal-period=${LENDING_POLICY_ADAPTIVE_RENEWAL_DAYS:15}
lending.policies.adaptive.fine-value-per-day-in-cents=${LENDING_POLICY_ADAPTIVE_FINE:200}

lending.policies.selection.history-period=${LENDING_POLICY_HISTORY_PERIOD_MONTHS:6}
lending.policies.selection.min-completed-lendings=${LENDING_POLICY_MIN_COMPLETED:3}
lending.policies.selection.min-on-time-ratio=${LENDING_POLICY_MIN_ON_TIME_RATIO:80.0}

lending.policies.long-term.duration-in-days=${LENDING_POLICY_LONG_TERM_DAYS:30}
lending.policies.long-term.max-simultaneous-lendings=${LENDING_POLICY_LONG_TERM_MAX:5}
lending.policies.long-term.fine-value-per-day-in-cents=${LENDING_POLICY_LONG_TERM_FINE:100}

lending.policies.short-term.duration-in-days=${LENDING_POLICY_SHORT_TERM_DAYS:7}
lending.policies.short-term.max-simultaneous-lendings=${LENDING_POLICY_SHORT_TERM_MAX:5}
lending.policies.short-term.fine-value-per-day-in-cents=${LENDING_POLICY_SHORT_TERM_FINE:400}

lending.policies.premium.duration-in-days=${LENDING_POLICY_PREMIUM_DAYS:30}
lending.policies.premium.max-simultaneous-lendings=${LENDING_POLICY_PREMIUM_MAX:5}
lending.policies.premium.fine-value-per-day-in-cents=${LENDING_POLICY_PREMIUM_FINE:100}
