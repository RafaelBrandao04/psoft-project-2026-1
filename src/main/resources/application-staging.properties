## ==============================================================================
## Profile: Staging (staging)
## Purpose: Pre-production verification, E2E acceptance, and automated QA testing
## ==============================================================================

demo.environment=staging
server.port=${PORT:8082}

## Staging Database
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:stagingdb;DB_CLOSE_DELAY=-1;IGNORECASE=TRUE}
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:staginguser}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:stagingpass}

## JPA settings: SQL logging disabled to mirror production performance
spring.jpa.show-sql=false
spring.jpa.hibernate.ddl-auto=update

## H2 Web Console disabled for security
spring.h2.console.enabled=false

## Dedicated staging upload directory
file.upload-dir=${FILE_UPLOAD_DIR:/opt/psoft-g1/uat/uploads}

## Logging configuration
logging.level.pt.psoft.g1=INFO
logging.level.org.springframework.web=WARN

## Actuator Health Details
management.endpoint.health.show-details=always

